name: Build APK

# 触发方式:推送到仓库 或 手动在 Actions 页点 Run workflow
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 项目根目录是 quant-app/,请把整个 quant-app 文件夹推到仓库根目录
    defaults:
      run:
        working-directory: quant-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 构建 Debug APK(可直接安装)
        run: gradle assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: quant-app-debug
          path: quant-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
