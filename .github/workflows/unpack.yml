name: Unpack quant-app.zip

on:
  workflow_dispatch:
  push:
    paths:
      - 'quant-app.zip'
      - '.github/unpack-trigger'

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure unzip is installed
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip quant-app.zip
        run: |
          if [ -f quant-app.zip ]; then
            unzip -o quant-app.zip -d .
          else
            echo "quant-app.zip not found in repo root" && exit 1
          fi

      - name: Commit and push unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quant-app || true
          git add quant-app/** || true
          git add . || true
          if git status --porcelain | grep -q .; then
            git commit -m "Unpack quant-app.zip"
            git push
          else
            echo "No changes to commit"
          fi
