name: Unpack archives

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Path to search for archives'
        required: false
        default: '.'
      pattern:
        description: 'Glob pattern (comma-separated) to match files'
        required: false
        default: '**/*.{zip,tar.gz,tar.bz2,tar.xz}'
      destination:
        description: 'Destination directory for extracted files'
        required: false
        default: 'extracted'
  push:
    paths:
      - '**/*.zip'
      - '**/*.tar.gz'
      - '**/*.tar.bz2'
      - '**/*.tar.xz'

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip p7zip-full

      - name: Find and extract archives
        env:
          SEARCH_PATH: ${{ github.event.inputs.path }}
          PATTERN: ${{ github.event.inputs.pattern }}
          DEST: ${{ github.event.inputs.destination }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          : "${SEARCH_PATH:=.}"
          : "${PATTERN:=**/*.{zip,tar.gz,tar.bz2,tar.xz}}"
          : "${DEST:=extracted}"

          mkdir -p "$DEST"
          IFS=',' read -ra PATTERNS <<< "$PATTERN"
          count=0
          for pat in "${PATTERNS[@]}"; do
            # Use eval to expand glob patterns relative to SEARCH_PATH
            for f in $(eval "echo $SEARCH_PATH/$pat"); do
              if [ -f "$f" ]; then
                echo "Extracting: $f"
                base=$(basename "$f")
                dir="$DEST/${base%.*}"
                mkdir -p "$dir"
                case "$f" in
                  *.zip) unzip -o "$f" -d "$dir" ;;
                  *.tar.gz|*.tgz) tar -xzf "$f" -C "$dir" ;;
                  *.tar.bz2|*.tbz2) tar -xjf "$f" -C "$dir" ;;
                  *.tar.xz|*.txz) tar -xJf "$f" -C "$dir" ;;
                  *.7z)  7z x -o"$dir" "$f" ;;
                  *) echo "Unsupported archive type: $f" ;;
                esac
                count=$((count+1))
              fi
            done
          done

          echo "Extracted $count archives to $DEST"
